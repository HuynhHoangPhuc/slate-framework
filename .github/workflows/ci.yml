name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

# Least-privilege default; jobs that need more must declare it explicitly.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025-vs2026]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025-vs2026]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  cross-check:
    name: cross-compile (macOS host → Windows target)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --target x86_64-pc-windows-msvc

  deny:
    name: cargo-deny (licenses + advisories + bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    name: cargo-audit (RustSec advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [check, clippy]
    strategy:
      fail-fast: false
      matrix:
        # Pin OS versions to match test job for consistency
        os: [macos-26, windows-2025-vs2026]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --release

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [check, clippy]
    strategy:
      fail-fast: false
      matrix:
        # Pin OS versions to avoid golden drift from rolling releases
        os: [macos-26, windows-2025-vs2026]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      # Skip-baseline lint: fail if the count of `#[ignore]`-marked tests
      # drifts above the committed baseline. Prevents silent test-skip
      # regressions (see tests/.skip-baseline for rationale + bump protocol).
      - name: Lint test-skip baseline
        shell: bash
        run: |
          count=$(cargo test --workspace --all-targets --features test-hooks -- --list 2>&1 | grep -c "ignored" || true)
          baseline=$(grep -E '^BASELINE_COUNT=' tests/.skip-baseline | cut -d= -f2)
          if [ -z "$baseline" ]; then
            echo "::error::tests/.skip-baseline missing BASELINE_COUNT= line"
            exit 1
          fi
          if [ "$count" -gt "$baseline" ]; then
            echo "::error::Ignored-test count ($count) exceeds baseline ($baseline). See tests/.skip-baseline for the bump protocol."
            exit 1
          fi
          echo "Ignored-test count: $count (baseline: $baseline) — OK"
      # test-hooks gates the platform dispatch + redraw suites; without it they
      # silently compile to zero tests. Enabling it makes them actually run and
      # satisfies the gated-suite sentinels.
      - run: cargo test --workspace --all-targets --features test-hooks
      - name: Upload visual regression diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vis-regress-diffs-${{ matrix.os }}
          path: target/vis-regress-diffs/**
          if-no-files-found: ignore
          retention-days: 7
