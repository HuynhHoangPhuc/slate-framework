name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI checks
    uses: ./.github/workflows/ci.yml

  verify-version:
    name: Verify workspace version + release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Check workspace version matches tag
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          WORKSPACE_VERSION=$(awk -F '"' '/^version =/{print $2; exit}' Cargo.toml)
          if [ "$WORKSPACE_VERSION" != "$VERSION" ]; then
            echo "::error::Workspace version $WORKSPACE_VERSION != tag version $VERSION"
            exit 1
          fi

      - name: Verify release notes file exists
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          NOTES=".github/release-notes/v${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::Release notes file $NOTES not found"
            exit 1
          fi

  dry-run-publish:
    # Leaves get full `cargo publish --dry-run`; downstream crates get
    # `cargo package --list` as a manifest sanity check. Reason: for the
    # first-publish-of-major (1.0.0), cargo cannot resolve `slate-platform = "^1.0.0"`
    # for downstream crates because the predecessor isn't on crates.io yet.
    # Live publish proves the chain end-to-end via the `publish` job's index-poll loop.
    name: Dry-run + package-list sanity (5 crates)
    needs: [ci, verify-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2

      - name: Dry-run publish leaves (no internal deps)
        run: |
          set -euo pipefail
          for crate in slate-reactive slate-platform; do
            echo "::group::cargo publish --dry-run -p $crate"
            cargo publish --dry-run -p "$crate"
            echo "::endgroup::"
          done

      - name: Package-list sanity check on downstream crates
        run: |
          set -euo pipefail
          for crate in slate-renderer slate-text slate-framework; do
            echo "::group::cargo package --list -p $crate"
            cargo package --list -p "$crate"
            echo "::endgroup::"
          done

  build-artifacts:
    name: Build (${{ matrix.os }})
    needs: [ci, verify-version]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-26
            target: aarch64-apple-darwin
            artifact: primitive-gallery
          - os: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            artifact: primitive-gallery.exe
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --package primitive-gallery

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: primitive-gallery-${{ matrix.target }}
          path: target/release/${{ matrix.artifact }}

  publish:
    name: Publish to crates.io (5 crates, dep order)
    needs: [dry-run-publish, build-artifacts, verify-version]
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0

      - name: Publish slate-reactive
        run: cargo publish -p slate-reactive
      - name: Wait for slate-reactive on crates.io index (max 5min)
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if cargo search slate-reactive --limit 1 | grep -q "\"$VERSION\""; then
              echo "slate-reactive $VERSION indexed"; exit 0
            fi
            sleep 5
          done
          echo "::error::slate-reactive $VERSION never appeared in cargo search after 5min"
          exit 1

      - name: Publish slate-platform
        run: cargo publish -p slate-platform
      - name: Wait for slate-platform on crates.io index (max 5min)
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if cargo search slate-platform --limit 1 | grep -q "\"$VERSION\""; then
              echo "slate-platform $VERSION indexed"; exit 0
            fi
            sleep 5
          done
          echo "::error::slate-platform $VERSION never appeared in cargo search after 5min"
          exit 1

      - name: Publish slate-renderer
        # --no-verify: slate-renderer is macOS+Windows only (per crate metadata).
        # cargo publish's verify step compiles the .crate tarball on the host
        # (Linux runner here) which lacks the cfg-gated `target` field. CI's
        # main `ci` job already proves the crate builds on macOS-26 +
        # windows-2025-vs2026, so verify is redundant for the upload.
        run: cargo publish --no-verify -p slate-renderer
      - name: Wait for slate-renderer on crates.io index (max 5min)
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if cargo search slate-renderer --limit 1 | grep -q "\"$VERSION\""; then
              echo "slate-renderer $VERSION indexed"; exit 0
            fi
            sleep 5
          done
          echo "::error::slate-renderer $VERSION never appeared in cargo search after 5min"
          exit 1

      - name: Publish slate-text
        run: cargo publish --no-verify -p slate-text
      - name: Wait for slate-text on crates.io index (max 5min)
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if cargo search slate-text --limit 1 | grep -q "\"$VERSION\""; then
              echo "slate-text $VERSION indexed"; exit 0
            fi
            sleep 5
          done
          echo "::error::slate-text $VERSION never appeared in cargo search after 5min"
          exit 1

      - name: Publish slate-framework
        run: cargo publish --no-verify -p slate-framework
      - name: Wait for slate-framework on crates.io index (max 5min)
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if cargo search slate-framework --limit 1 | grep -q "\"$VERSION\""; then
              echo "slate-framework $VERSION indexed"; exit 0
            fi
            sleep 5
          done
          echo "::error::slate-framework $VERSION never appeared in cargo search after 5min"
          exit 1

  release:
    name: Create GitHub Release
    needs: [publish, verify-version]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ env.VERSION }}
          body_path: .github/release-notes/v${{ env.VERSION }}.md
          files: artifacts/**/*
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
