[workspace]
members = [
    "crates/slate-platform",
    "crates/slate-reactive",
    "crates/slate-renderer",
    "crates/slate-text",
    "crates/slate-framework",
    "crates/slate-bench",
    "examples/anchor-md-to-png",
    "examples/click-counter",
    "examples/dense-image-gallery",
    "examples/hello-element",
    "examples/hello-rect",
    "examples/ime-textfield",
    "examples/primitive-gallery",
    "examples/reactive-counter",
    "examples/recovery-gallery",
    "examples/textarea",
    "examples/two-window-counters",
    "examples/win-dcomp-spike",
]
resolver = "2"

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/HuynhHoangPhuc/slate-framework"
authors = ["Phuc Huynh <huynhhoangphuc@proton.me>"]

[workspace.dependencies]
# Workspace internal crates
slate-reactive = { path = "crates/slate-reactive", version = "0.0.2" }
# All deps pinned to latest stable as of 2026-05-04.
# Bump deliberately; record reason in commit message.
# wgpu pinned to exact patch (Phase 1 prereq, red-team P0-5): wgpu pre-1.0
# ships breaking shader/blend changes between patch releases. Bump only
# after re-running smoke_premul + hello-rect on macOS + Windows.
wgpu = "=29.0.3"
raw-window-handle = "0.6"
glam = "0.32"
bytemuck = { version = "1.25", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
pollster = "0.4"
parking_lot = "0.12"
unicode-segmentation = "1"
unicode-bidi = "0.3"
unicode-linebreak = "0.1"
# macOS-only deps (target.'cfg(target_os = "macos")')
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSAttributedString",
    "NSDictionary",
    "NSGeometry",
    "NSNotification",
    "NSObject",
    "NSString",
] }
dirs = "6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSPasteboard",
    "NSResponder",
    "NSTextInputClient",
    "NSTextInputContext",
    "NSView",
    "NSWindow",
] }
objc2-quartz-core = { version = "0.3", features = [
    "CALayer",
    "CAMetalLayer",
] }
objc2-core-text = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-foundation = "0.3.2"
dispatch = "0.2"
# Windows-only deps (target.'cfg(target_os = "windows")')
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# Visual regression test dependencies (dev-only)
image = "0.25"
image-compare = "0.5"
# Snapshot testing (dev-only). Used to pin ordered dispatch traces so
# refactors that re-shape AppState surface a diff instead of silent drift.
insta = { version = "1.47", features = ["filters"] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = false
strip = true
