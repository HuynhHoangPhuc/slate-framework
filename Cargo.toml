[workspace]
members = [
    "crates/slate-platform",
    "crates/slate-renderer",
    "crates/slate-framework",
    "examples/hello-rect",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/HuynhHoangPhuc/slate-framework"
authors = ["Phuc Huynh <huynhhoangphuc@proton.me>"]

[workspace.dependencies]
# All deps pinned to latest stable as of 2026-05-04.
# Bump deliberately; record reason in commit message.
wgpu = "29"
raw-window-handle = "0.6"
glam = "0.32"
bytemuck = { version = "1.25", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
pollster = "0.4"
# macOS-only deps (target.'cfg(target_os = "macos")')
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
# Windows-only deps (target.'cfg(target_os = "windows")')
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = false
strip = true
