[package]
name = "slate-bench"
description = "Reference-scene benchmark harness for slate-framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
slate-framework = { path = "../slate-framework", version = "1.0.1", features = ["profiling"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "dense_image_gallery"
harness = false

[[bench]]
name = "textarea_1k_line"
harness = false

[[bench]]
name = "reactive_counter_100"
harness = false

[[bench]]
name = "fine_grained_subscription"
harness = false

[[bench]]
name = "ime_textfield"
harness = false

[[bench]]
name = "large_scroll_list"
harness = false
