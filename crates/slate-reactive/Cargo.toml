[package]
name = "slate-reactive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Reactive primitives (signals, memos, effects) for the slate-framework UI framework"
readme = "README.md"
keywords = ["reactive", "signals", "ui", "gui", "framework"]
categories = ["gui", "rust-patterns"]

[features]
default = []
# Enables in-process profiling counters (signal-notify, effect-reentry) on
# atomic statics. Counters compile out of the default build via per-call-site
# `#[cfg(feature = "profiling")]` gates.
profiling = []

[dependencies]
parking_lot.workspace = true
log.workspace = true

[dev-dependencies]
trybuild = "1"
