[package]
name = "slate-renderer"
description = "wgpu-based GPU renderer for the slate-framework UI framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["gui", "gpu", "wgpu", "renderer", "graphics"]
categories = ["gui", "graphics", "rendering::graphics-api"]

[dependencies]
slate-platform = { path = "../slate-platform", version = "0.0.2" }
wgpu.workspace = true
raw-window-handle.workspace = true
glam.workspace = true
bytemuck.workspace = true
log.workspace = true
thiserror.workspace = true
pollster.workspace = true
etagere = "0.2.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",
] }
