[package]
name = "slate-text"
description = "Native text shaping and rasterization for Slate UI framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
slate-renderer = { path = "../slate-renderer", version = "0.0.2" }
thiserror.workspace = true
log.workspace = true
wgpu.workspace = true
parking_lot = "0.12"
rustc-hash = "2"
ttf-parser = "0.25"
memmap2 = "0.9"
unicode-segmentation.workspace = true
unicode-bidi.workspace = true
unicode-linebreak.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Graphics_DirectWrite"] }
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-core-text = { workspace = true }
objc2-core-graphics = { workspace = true }
objc2-core-foundation = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
image = { workspace = true }
image-compare = { workspace = true }
pollster.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
