[package]
name = "anchor-md-to-png"
description = "Phase 3.5 anchor spike — markdown to PNG headless renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
default-run = "anchor-md-to-png"

[[bin]]
name = "anchor-md-to-png"
path = "src/main.rs"

[[bin]]
name = "diff"
path = "src/bin/diff.rs"

[dependencies]
slate-framework = { path = "../../crates/slate-framework", version = "0.0.2" }
pulldown-cmark = "0.13"
image.workspace = true
log.workspace = true
env_logger.workspace = true
